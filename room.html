<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZivoCam Oda</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#0f172a;
  color:white;
  min-height:100vh;
}

header{
  padding:18px;
  background:#111827;
  border-bottom:1px solid #334155;
  text-align:center;
}

header h1{
  color:#22c55e;
}

.panel{
  max-width:900px;
  margin:25px auto;
  background:#111827;
  padding:20px;
  border-radius:16px;
  border:1px solid #334155;
  text-align:center;
}

input{
  padding:13px;
  margin:8px;
  width:230px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  padding:12px 18px;
  margin:8px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{background:#16a34a}

.danger{background:#ef4444}
.danger:hover{background:#dc2626}

.gray{background:#475569}
.gray:hover{background:#334155}

#durum{
  margin-top:12px;
  color:#cbd5e1;
}

#videos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
  padding:25px;
}

.video-card{
  background:#111827;
  border:1px solid #334155;
  border-radius:16px;
  padding:12px;
}

video{
  width:100%;
  height:260px;
  background:black;
  border-radius:12px;
  object-fit:cover;
}

.name{
  margin-top:8px;
  color:#e5e7eb;
}
</style>
</head>

<body>

<header>
  <h1>🎥 ZivoCam</h1>
  <p id="odaBilgi">Oda bekleniyor...</p>
</header>

<div class="panel">
  <h2>Odaya Katıl</h2>
  <p>Aynı oda adını giren herkes birbirini görebilir.</p>

  <input id="ad" placeholder="Adın">
  <input id="oda" placeholder="Oda adı örn: test123">

  <br>

  <button onclick="odayaGir()">Odaya Gir</button>
  <button class="gray" onclick="linkKopyala()">Oda Linkini Kopyala</button>

  <p id="durum">Hazır</p>
</div>

<div class="panel">
  <button onclick="kameraToggle()" id="kameraBtn">Kamera Kapat</button>
  <button onclick="mikrofonToggle()" id="mikrofonBtn">Mikrofon Kapat</button>
  <button class="danger" onclick="cikis()">Odadan Çık</button>
</div>

<div id="videos"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBmSzMlnTX94BKdUuHDPiVRqwu8of1RqHw",
  authDomain: "filmizleplusx.firebaseapp.com",
  projectId: "filmizleplusx",
  storageBucket: "filmizleplusx.firebasestorage.app",
  messagingSenderId: "296091084316",
  appId: "1:296091084316:web:aba2def23f6ce2b03761d9",
  measurementId: "G-SFQ2RQQH19"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let myId = Date.now().toString() + "-" + Math.random().toString(36).slice(2,8);
let myName = "";
let roomId = "";
let localStream = null;
let peers = {};
let joined = false;
let usersUnsub = null;
let signalsUnsub = null;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

const params = new URLSearchParams(location.search);
if(params.get("oda")){
  document.getElementById("oda").value = params.get("oda");
}

function durum(txt){
  document.getElementById("durum").innerText = txt;
}

function videoEkle(id, stream, name, muted=false){
  if(document.getElementById("card-" + id)) return;

  const card = document.createElement("div");
  card.className = "video-card";
  card.id = "card-" + id;

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;
  video.muted = muted;
  video.srcObject = stream;

  const isim = document.createElement("div");
  isim.className = "name";
  isim.innerText = name;

  card.appendChild(video);
  card.appendChild(isim);
  document.getElementById("videos").appendChild(card);
}

async function odayaGir(){
  if(joined) return alert("Zaten odadasın.");

  myName = document.getElementById("ad").value.trim();
  roomId = document.getElementById("oda").value.trim();

  if(!myName) return alert("Adını yaz.");
  if(!roomId) return alert("Oda adı yaz.");

  durum("Kamera açılıyor...");

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

    videoEkle(myId, localStream, myName + " (Sen)", true);

    const roomRef = db.collection("rooms").doc(roomId);

    await roomRef.collection("users").doc(myId).set({
      id: myId,
      name: myName,
      joinedAt: Date.now()
    });

    joined = true;

    document.getElementById("odaBilgi").innerText = "Oda: " + roomId;
    history.replaceState(null, "", location.pathname + "?oda=" + encodeURIComponent(roomId));

    sinyalDinle();
    kullaniciDinle();

    durum("Odaya bağlandın. Diğer kullanıcılar bekleniyor...");
  }catch(e){
    console.error(e);
    alert("Kamera açılamadı: " + e.message);
    durum("Kamera hatası");
  }
}

function kullaniciDinle(){
  const roomRef = db.collection("rooms").doc(roomId);

  usersUnsub = roomRef.collection("users").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      const user = change.doc.data();

      if(!user || user.id === myId) return;

      if(change.type === "added"){
        /*
          ÖNEMLİ:
          Sadece eski kullanıcı yeni kullanıcıya teklif göndersin.
          Böylece iki taraf aynı anda offer atıp bağlantıyı bozmaz.
        */
        if(myId < user.id){
          teklifGonder(user.id, user.name);
        }
      }

      if(change.type === "removed"){
        kullaniciSil(user.id);
      }
    });
  });
}

function sinyalDinle(){
  const roomRef = db.collection("rooms").doc(roomId);

  signalsUnsub = roomRef.collection("signals")
    .where("to", "==", myId)
    .onSnapshot(snapshot => {
      snapshot.docChanges().forEach(async change => {
        const data = change.doc.data();
        if(!data) return;

        try{
          if(data.type === "offer"){
            await teklifAl(data);
          }

          if(data.type === "answer"){
            const pc = peers[data.from];
            if(pc){
              await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
          }

          if(data.type === "candidate"){
            const pc = peers[data.from];
            if(pc && data.candidate){
              await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
          }

          await change.doc.ref.delete().catch(()=>{});
        }catch(err){
          console.error("Sinyal hatası:", err);
        }
      });
    });
}

function peerOlustur(otherId, otherName){
  if(peers[otherId]) return peers[otherId];

  const pc = new RTCPeerConnection(rtcConfig);
  peers[otherId] = pc;

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.ontrack = event => {
    videoEkle(otherId, event.streams[0], otherName || "Katılımcı");
    durum("Bağlantı kuruldu.");
  };

  pc.onicecandidate = event => {
    if(event.candidate){
      db.collection("rooms").doc(roomId).collection("signals").add({
        type:"candidate",
        from:myId,
        to:otherId,
        candidate:event.candidate.toJSON()
      });
    }
  };

  pc.onconnectionstatechange = () => {
    console.log(otherId, pc.connectionState);

    if(pc.connectionState === "connected"){
      durum("Bağlantı kuruldu.");
    }

    if(pc.connectionState === "failed" || pc.connectionState === "disconnected" || pc.connectionState === "closed"){
      kullaniciSil(otherId);
    }
  };

  return pc;
}

async function teklifGonder(otherId, otherName){
  if(peers[otherId]) return;

  const pc = peerOlustur(otherId, otherName);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await db.collection("rooms").doc(roomId).collection("signals").add({
    type:"offer",
    from:myId,
    to:otherId,
    fromName:myName,
    offer:offer
  });
}

async function teklifAl(data){
  const pc = peerOlustur(data.from, data.fromName || "Katılımcı");

  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await db.collection("rooms").doc(roomId).collection("signals").add({
    type:"answer",
    from:myId,
    to:data.from,
    fromName:myName,
    answer:answer
  });
}

function kameraToggle(){
  if(!localStream) return;

  const track = localStream.getVideoTracks()[0];
  track.enabled = !track.enabled;

  document.getElementById("kameraBtn").innerText =
    track.enabled ? "Kamera Kapat" : "Kamera Aç";
}

function mikrofonToggle(){
  if(!localStream) return;

  const track = localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;

  document.getElementById("mikrofonBtn").innerText =
    track.enabled ? "Mikrofon Kapat" : "Mikrofon Aç";
}

function kullaniciSil(id){
  if(peers[id]){
    peers[id].close();
    delete peers[id];
  }

  const card = document.getElementById("card-" + id);
  if(card) card.remove();
}

async function cikis(){
  try{
    if(joined && roomId){
      await db.collection("rooms").doc(roomId).collection("users").doc(myId).delete();
    }
  }catch(e){}

  if(usersUnsub) usersUnsub();
  if(signalsUnsub) signalsUnsub();

  Object.keys(peers).forEach(id => peers[id].close());
  peers = {};

  if(localStream){
    localStream.getTracks().forEach(track => track.stop());
  }

  location.reload();
}

function linkKopyala(){
  const oda = document.getElementById("oda").value.trim();

  if(!oda) return alert("Önce oda adı yaz.");

  const link = location.origin + location.pathname + "?oda=" + encodeURIComponent(oda);

  navigator.clipboard.writeText(link)
    .then(() => alert("Link kopyalandı:\n" + link))
    .catch(() => alert("Link:\n" + link));
}

window.addEventListener("beforeunload", () => {
  if(joined && roomId){
    db.collection("rooms").doc(roomId).collection("users").doc(myId).delete();
  }
});
</script>

</body>
</html>
